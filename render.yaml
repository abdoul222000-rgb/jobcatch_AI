services:
  - type: web
    name: jobcatch-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn jobcatch.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
